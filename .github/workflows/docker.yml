name: Build, test and publish Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dev-box:ci
          build-args: |
            ACCEPT_ANDROID_LICENSES=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test as non-root user
        run: docker run --rm --entrypoint bash dev-box:ci -s < scripts/smoke-test.sh
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          HUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          HUB_NAMESPACE: ${{ vars.DOCKER_HUB_NAMESPACE }}
        run: |
          set -euo pipefail
          namespace="${HUB_NAMESPACE:-$HUB_USER}"
          test -n "$namespace"
          image="$namespace/dev-box"
          docker tag dev-box:ci "$image:sha-${GITHUB_SHA::12}"
          docker push "$image:sha-${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag dev-box:ci "$image:latest"
            docker push "$image:latest"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag dev-box:ci "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          fi
